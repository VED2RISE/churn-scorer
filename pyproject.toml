[project]
name = "churn-scorer"
version = "0.1.0"
description = "Скоринг риска ухода пользователей по журналу событий продукта"
requires-python = ">=3.12,<3.13"
# Все зависимости уже стоят в подготовленном окружении candidate-python-environment/.venv.
# Ничего доустанавливать не нужно.
dependencies = [
  "joblib>=1.4,<2.0",
  "numpy>=1.24",
  "pandas>=2.2",
  "scikit-learn>=1.5,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
